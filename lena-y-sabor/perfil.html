<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Perfil | Leña y Sabor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <link href="css/styles.css" rel="stylesheet"/>
</head>
<body data-page="perfil">

  <div id="toast-container" class="toast-container-lys"></div>

  <!-- navbar -->
  <nav class="lys-navbar navbar navbar-expand-lg fixed-top">
    <div class="container-xl">
      <a class="navbar-brand" href="index.html">🔥 Leña y Sabor</a>
      <button id="navbar-toggler" class="navbar-toggler" type="button">
        <span class="material-icons" style="color:var(--on-muted)">menu</span>
      </button>
      <div class="collapse navbar-collapse" id="navbar-menu">
        <ul class="navbar-nav ms-auto gap-lg-4 mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2 ms-lg-4 mt-2 mt-lg-0">
          <button id="nav-cart-btn" class="nav-icon-btn position-relative">
            <span class="material-icons">shopping_cart</span>
            <span class="cart-count cart-badge" style="display:none">0</span>
          </button>
          <button class="btn-danger-lys btn-logout">Cerrar Sesion</button>
        </div>
      </div>
    </div>
  </nav>

  <main style="padding-top:90px;padding-bottom:4rem;">
    <div class="container-xl">
      <div class="row g-4">

        <!-- sidebar del perfil -->
        <div class="col-12 col-lg-3">
          <div style="background:var(--surface-mid);border-radius:var(--radius-card);padding:2rem;text-align:center;">
            <div class="profile-avatar-placeholder mx-auto mb-3">
              <span class="material-icons" style="font-size:3rem;">person</span>
            </div>
            <div style="font-family:var(--font-head);font-weight:900;font-size:1.1rem;" id="perfil-nombre">Usuario</div>
            <div style="color:var(--on-muted);font-size:0.82rem;" id="perfil-email">email@demo.com</div>
            <div style="color:var(--on-muted);font-size:0.78rem;margin-top:0.3rem;" id="perfil-telefono">Sin telefono</div>

            <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,0.05);">
              <a href="pedidos.html" style="display:flex;align-items:center;gap:0.6rem;color:var(--on-muted);padding:0.5rem;border-radius:0.4rem;font-size:0.88rem;text-decoration:none;transition:var(--transition);"
                 onmouseover="this.style.background='var(--surface-high)';this.style.color='var(--on-surface)'"
                 onmouseout="this.style.background='';this.style.color='var(--on-muted)'">
                <span class="material-icons" style="font-size:1rem;">local_shipping</span>
                Mis Pedidos
              </a>
              <button class="btn-logout" style="display:flex;align-items:center;gap:0.6rem;color:var(--primary);padding:0.5rem;border-radius:0.4rem;font-size:0.88rem;background:none;border:none;cursor:pointer;width:100%;transition:var(--transition);"
                onmouseover="this.style.background='rgba(235,0,0,0.1)'"
                onmouseout="this.style.background=''">
                <span class="material-icons" style="font-size:1rem;">logout</span>
                Cerrar Sesion
              </button>
            </div>
          </div>
        </div>

        <!-- contenido principal -->
        <div class="col-12 col-lg-9">
          <!-- editar perfil -->
          <div style="background:var(--surface-mid);border-radius:var(--radius-card);padding:2rem;margin-bottom:1.5rem;">
            <h2 style="font-family:var(--font-head);font-weight:900;font-size:1.2rem;margin-bottom:1.5rem;">
              Informacion Personal
            </h2>
            <form id="form-perfil" novalidate>
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label-lys">Nombre Completo</label>
                  <input id="perfil-nombre-input" type="text" class="form-control-lys" placeholder="Tu nombre"/>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label-lys">Correo Electronico</label>
                  <input id="perfil-email-input" type="email" class="form-control-lys" placeholder="tu@correo.com" disabled
                         style="opacity:0.6;cursor:not-allowed;"/>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label-lys">Telefono</label>
                  <input id="perfil-telefono-input" type="tel" class="form-control-lys" placeholder="999-999-999"/>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label-lys">Direccion Habitual</label>
                  <input id="perfil-direccion" type="text" class="form-control-lys" placeholder="Av. Ejemplo 1234, Lima"/>
                </div>
                <div class="col-12">
                  <button type="button" class="btn-brasa" onclick="guardarPerfil()">
                    Guardar Cambios
                  </button>
                </div>
              </div>
            </form>
          </div>

          <!-- cambiar contrasena -->
          <div style="background:var(--surface-mid);border-radius:var(--radius-card);padding:2rem;margin-bottom:1.5rem;">
            <h2 style="font-family:var(--font-head);font-weight:900;font-size:1.2rem;margin-bottom:1.5rem;">
              Cambiar Contrasena
            </h2>
            <div class="row g-3">
              <div class="col-12 col-md-4">
                <label class="form-label-lys">Actual</label>
                <input type="password" class="form-control-lys" placeholder="••••••••"/>
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label-lys">Nueva</label>
                <input type="password" class="form-control-lys" placeholder="••••••••"/>
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label-lys">Confirmar Nueva</label>
                <input type="password" class="form-control-lys" placeholder="••••••••"/>
              </div>
              <div class="col-12">
                <button class="btn-secondary-lys" onclick="View.showToast('Contrasena actualizada','success')">
                  Actualizar Contrasena
                </button>
              </div>
            </div>
          </div>

          <!-- ultimos pedidos -->
          <div style="background:var(--surface-mid);border-radius:var(--radius-card);padding:2rem;">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 style="font-family:var(--font-head);font-weight:900;font-size:1.2rem;margin:0;">
                Pedidos Recientes
              </h2>
              <a href="pedidos.html" style="color:var(--secondary);font-size:0.85rem;">Ver todos →</a>
            </div>
            <div id="perfil-pedidos">
              <!-- renderizado por JS -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/model.js"></script>
  <script src="js/view.js"></script>
  <script src="js/controller.js"></script>
  <script>
    function guardarPerfil() {
      View.showToast('Perfil actualizado correctamente', 'success');
    }
  </script>
</body>
</html>
