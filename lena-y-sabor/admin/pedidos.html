<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pedidos Admin | Leña y Sabor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <link href="../css/styles.css" rel="stylesheet"/>
</head>
<body data-page="admin-pedidos" style="overflow-x:hidden;">

  <div id="toast-container" class="toast-container-lys"></div>

  <!-- sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="sidebar-brand">🔥 Leña y Sabor
      <span style="font-size:0.58rem;background:rgba(235,0,0,0.2);color:var(--primary);padding:0.15rem 0.4rem;border-radius:3px;margin-left:0.3rem;">ADMIN</span>
    </div>
    <div class="sidebar-section">Principal</div>
    <a href="dashboard.html"     class="sidebar-link"><span class="material-icons">dashboard</span>Dashboard</a>
    <a href="pedidos.html"       class="sidebar-link active"><span class="material-icons">receipt_long</span>Pedidos
      <span style="margin-left:auto;background:var(--primary-cta);color:white;font-size:0.6rem;font-weight:800;padding:0.1rem 0.4rem;border-radius:10px;">4</span>
    </a>
    <a href="productos.html"     class="sidebar-link"><span class="material-icons">restaurant_menu</span>Productos</a>
    <a href="inventario.html"    class="sidebar-link"><span class="material-icons">inventory_2</span>Inventario</a>
    <div class="sidebar-section">Configuracion</div>
    <a href="configuracion.html" class="sidebar-link"><span class="material-icons">settings</span>Ajustes</a>
    <div style="margin-top:auto;padding:1rem;">
      <a href="../index.html" class="sidebar-link" style="color:var(--secondary);"><span class="material-icons">storefront</span>Ver Tienda</a>
      <button class="btn-logout sidebar-link" style="width:100%;background:none;border:none;cursor:pointer;color:var(--primary);">
        <span class="material-icons">logout</span>Cerrar Sesion
      </button>
    </div>
  </aside>

  <!-- main -->
  <div class="admin-main">
    <div class="d-flex align-items-center gap-3 mb-4">
      <button id="sidebar-toggle" class="nav-icon-btn d-lg-none"><span class="material-icons">menu</span></button>
      <div>
        <h1 style="font-family:var(--font-head);font-size:1.5rem;font-weight:900;margin:0;">Gestion de Pedidos</h1>
        <div style="color:var(--on-muted);font-size:0.78rem;">Actualiza y supervisa todos los pedidos en tiempo real</div>
      </div>
    </div>

    <!-- filtros y busqueda -->
    <div style="background:var(--surface-mid);border-radius:var(--radius-card);padding:1.2rem;margin-bottom:1.5rem;">
      <div class="d-flex flex-wrap gap-3 align-items-center">
        <div class="position-relative" style="flex:1;min-width:200px;">
          <span class="material-icons" style="position:absolute;left:0.7rem;top:50%;transform:translateY(-50%);color:var(--on-muted);font-size:1rem;">search</span>
          <input type="text" id="search-pedido" placeholder="Buscar por ID o producto..."
                 class="form-control-lys" style="padding-left:2.2rem;"
                 oninput="filtrarPedidosAdmin(this.value)"/>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <button class="category-chip active" onclick="filtroEstado('todos',this)">Todos</button>
          <button class="category-chip" onclick="filtroEstado('pendiente',this)">Pendientes</button>
          <button class="category-chip" onclick="filtroEstado('preparando',this)">Preparando</button>
          <button class="category-chip" onclick="filtroEstado('listo',this)">Listos</button>
          <button class="category-chip" onclick="filtroEstado('entregado',this)">Entregados</button>
        </div>
      </div>
    </div>

    <!-- tabla de pedidos -->
    <div style="background:var(--surface-mid);border-radius:var(--radius-card);padding:1.5rem;overflow-x:auto;">
      <div id="admin-pedidos-tabla">
        <div style="color:var(--on-muted);text-align:center;padding:2rem;">Cargando pedidos...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/model.js"></script>
  <script src="../js/view.js"></script>
  <script src="../js/controller.js"></script>
  <script>
    document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
      document.getElementById('admin-sidebar').classList.toggle('open');
    });

    function filtroEstado(estado, btn) {
      document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      const container = document.getElementById('admin-pedidos-tabla');
      let pedidos = Model.getPedidos();
      if (estado !== 'todos') pedidos = pedidos.filter(p => p.estado === estado);
      if (pedidos.length === 0) {
        container.innerHTML = '<div style="color:var(--on-muted);text-align:center;padding:2rem;">No hay pedidos en este estado.</div>';
        return;
      }
      const rows = pedidos.map(p => View.renderOrderRow(p)).join('');
      container.innerHTML = `
        <table class="admin-table">
          <thead><tr>
            <th>ID</th><th>Fecha</th><th>Productos</th><th>Total</th><th>Estado</th><th>Cambiar Estado</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
      // re-bind selects
      document.querySelectorAll('.select-estado').forEach(select => {
        select.addEventListener('change', () => {
          Model.cambiarEstadoPedido(select.dataset.id, select.value);
          View.showToast(`Pedido ${select.dataset.id} → ${select.value}`, 'success');
          const row = select.closest('tr');
          const estadoMap = { pendiente:'badge-pending',preparando:'badge-preparing',listo:'badge-ready',entregado:'badge-delivered',cancelado:'badge-cancelled' };
          row.children[4].innerHTML = `<span class="badge-status ${estadoMap[select.value]}">${select.value.charAt(0).toUpperCase()+select.value.slice(1)}</span>`;
        });
      });
    }

    function filtrarPedidosAdmin(q) {
      const container = document.getElementById('admin-pedidos-tabla');
      const pedidos = Model.getPedidos().filter(p =>
        p.id.toLowerCase().includes(q.toLowerCase()) ||
        p.items.some(i => i.nombre.toLowerCase().includes(q.toLowerCase()))
      );
      if (pedidos.length === 0) {
        container.innerHTML = '<div style="color:var(--on-muted);text-align:center;padding:2rem;">Sin resultados.</div>';
        return;
      }
      const rows = pedidos.map(p => View.renderOrderRow(p)).join('');
      container.innerHTML = `
        <table class="admin-table">
          <thead><tr>
            <th>ID</th><th>Fecha</th><th>Productos</th><th>Total</th><th>Estado</th><th>Cambiar Estado</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }
  </script>
</body>
</html>
