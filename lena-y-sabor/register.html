<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrarse | Leña y Sabor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <link href="css/styles.css" rel="stylesheet"/>
</head>
<body data-page="register">

  <div id="toast-container" class="toast-container-lys"></div>

  <div style="position:fixed;inset:0;z-index:-1;">
    <img src="https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?auto=format&fit=crop&w=1400&q=80"
         alt="" style="width:100%;height:100%;object-fit:cover;opacity:0.1;"/>
  </div>

  <nav style="padding:1rem 2rem;display:flex;align-items:center;gap:1rem;">
    <a href="login.html" style="color:var(--on-muted);display:flex;align-items:center;gap:0.3rem;font-size:0.88rem;">
      <span class="material-icons" style="font-size:1rem;">arrow_back</span> Volver al Login
    </a>
    <a class="navbar-brand ms-auto" href="index.html" style="font-family:var(--font-head);font-weight:900;font-size:1.2rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--primary);">
      🔥 Leña y Sabor
    </a>
  </nav>

  <main class="d-flex justify-content-center align-items-center" style="min-height:calc(100vh - 80px);padding:2rem 1rem;">
    <div class="form-card fade-up" style="max-width:520px;">
      <div class="text-center mb-4">
        <div style="font-size:3rem;margin-bottom:0.5rem;">🔥</div>
        <h1 class="form-title">Crear Cuenta</h1>
        <p class="form-subtitle">Registrate y disfruta de beneficios exclusivos</p>
      </div>

      <form id="form-register" novalidate>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label-lys">Nombre Completo *</label>
            <input id="reg-nombre" type="text" class="form-control-lys" placeholder="Juan Perez" required/>
          </div>
          <div class="col-12">
            <label class="form-label-lys">Correo Electronico *</label>
            <input id="reg-email" type="email" class="form-control-lys" placeholder="tu@correo.com" required/>
          </div>
          <div class="col-12">
            <label class="form-label-lys">Telefono (opcional)</label>
            <input id="reg-telefono" type="tel" class="form-control-lys" placeholder="999-999-999"/>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label-lys">Contrasena *</label>
            <div class="position-relative">
              <input id="reg-password" type="password" class="form-control-lys" placeholder="Min. 6 caracteres" required/>
              <button type="button" onclick="togglePass('reg-password',this)"
                style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--on-muted);cursor:pointer;">
                <span class="material-icons" style="font-size:1.1rem;">visibility</span>
              </button>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label-lys">Confirmar Contrasena *</label>
            <input id="reg-password2" type="password" class="form-control-lys" placeholder="Repite tu contrasena" required/>
          </div>
          <div class="col-12">
            <div style="font-size:0.78rem;color:var(--on-muted);line-height:1.5;">
              Al registrarte aceptas nuestros <a href="#" style="color:var(--secondary);">Terminos y Condiciones</a>
              y <a href="#" style="color:var(--secondary);">Politica de Privacidad</a>.
            </div>
          </div>
          <div class="col-12">
            <button type="submit" class="btn-brasa w-100" style="justify-content:center;">
              Crear mi Cuenta
            </button>
          </div>
        </div>
      </form>

      <div class="form-divider">ya tienes cuenta?</div>

      <div class="text-center">
        <a href="login.html" class="btn-secondary-lys" style="justify-content:center;width:100%;">
          Iniciar Sesion
        </a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/model.js"></script>
  <script src="js/view.js"></script>
  <script src="js/controller.js"></script>
  <script>
    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon  = btn.querySelector('.material-icons');
      if (input.type === 'password') { input.type = 'text'; icon.textContent = 'visibility_off'; }
      else { input.type = 'password'; icon.textContent = 'visibility'; }
    }
  </script>
</body>
</html>
