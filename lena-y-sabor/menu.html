<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu | Leña y Sabor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <link href="css/styles.css" rel="stylesheet"/>
</head>
<body data-page="menu">

  <div id="toast-container" class="toast-container-lys"></div>

  <!-- navbar -->
  <nav class="lys-navbar navbar navbar-expand-lg fixed-top">
    <div class="container-xl">
      <a class="navbar-brand" href="index.html">🔥 Leña y Sabor</a>
      <button id="navbar-toggler" class="navbar-toggler" type="button">
        <span class="material-icons" style="color:var(--on-muted)">menu</span>
      </button>
      <div class="collapse navbar-collapse" id="navbar-menu">
        <ul class="navbar-nav ms-auto gap-lg-4 mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="promociones.html">Promociones</a></li>
          <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2 ms-lg-4 mt-2 mt-lg-0">
          <button id="nav-cart-btn" class="nav-icon-btn position-relative">
            <span class="material-icons">shopping_cart</span>
            <span class="cart-count cart-badge" style="display:none">0</span>
          </button>
          <button id="nav-perfil-btn" class="nav-icon-btn">
            <span class="material-icons">account_circle</span>
          </button>
          <span class="show-logged d-none" style="font-size:0.82rem;color:var(--secondary);">
            <span class="nav-user-name"></span>
          </span>
          <a href="login.html" class="show-guest btn-ghost-lys" style="font-size:0.82rem;padding:0.4rem 1rem;">Ingresar</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- header de pagina -->
  <div style="padding-top:90px;background:linear-gradient(to bottom, var(--surface-low), var(--bg));padding-bottom:2rem;">
    <div class="container-xl">
      <div class="section-tag mt-3">Carta Completa</div>
      <h1 class="section-title">Nuestro <span class="accent">Menu</span></h1>
      <p style="color:var(--on-muted);max-width:500px;">Selecciona tu combinacion perfecta. Todo preparado al momento con ingredientes frescos.</p>
    </div>
  </div>

  <!-- barra de busqueda y filtros -->
  <div style="background:var(--surface-low);padding:1.5rem 0;position:sticky;top:70px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,0.3);">
    <div class="container-xl">
      <div class="d-flex flex-column flex-md-row gap-3 align-items-md-center">

        <!-- busqueda -->
        <div class="position-relative" style="max-width:300px;width:100%;">
          <span class="material-icons" style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:var(--on-muted);font-size:1.1rem;">search</span>
          <input
            id="search-input"
            type="text"
            placeholder="Buscar en el menu..."
            class="form-control-lys"
            style="padding-left:2.5rem;"
          />
        </div>

        <!-- chips de categoria -->
        <div class="d-flex gap-2 flex-wrap">
          <button class="category-chip active" data-cat="todos">Todos</button>
          <button class="category-chip" data-cat="pollo">🍗 Pollos</button>
          <button class="category-chip" data-cat="combos">🎁 Combos</button>
          <button class="category-chip" data-cat="acompanantes">🍟 Acompanantes</button>
          <button class="category-chip" data-cat="bebidas">🥤 Bebidas</button>
          <button class="category-chip" data-cat="postres">🍮 Postres</button>
        </div>
      </div>
    </div>
  </div>

  <!-- grid de productos -->
  <main class="section-pad" style="padding-top:2.5rem;">
    <div class="container-xl">
      <div id="menu-grid">
        <!-- renderizado por JS -->
        <div class="text-center py-5">
          <div style="color:var(--on-muted);">Cargando menu...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- footer compact -->
  <footer class="lys-footer" style="margin-top:2rem;">
    <div class="container-xl">
      <div class="footer-bottom d-flex justify-content-between flex-wrap gap-2">
        <span>© 2025 Leña y Sabor</span>
        <a href="index.html" style="color:var(--secondary);">← Volver al inicio</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/model.js"></script>
  <script src="js/view.js"></script>
  <script src="js/controller.js"></script>
</body>
</html>
